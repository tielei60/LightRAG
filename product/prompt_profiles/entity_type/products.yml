entity_types_guidance: |
  从原文建立可追溯的产品检索图谱。类型：Product为产品；Plan为原文明示并命名的投保计划，不以责任分类创建计划；Coverage为实际保险责任；UnderwritingRule为投保或责任选择条件；Rule为有明确范围的合同规则；Organization为原文明示机构；Concept为术语或费用组成项的定义，不将释义项分类为保险责任；其他用Other。

  名称用于定位，描述用于保留证据：
  - 产品专属实体命名为“产品全称｜原文名称”，局部规则为“产品全称｜责任原称｜规则短名”。保留同一责任名称，不将不同产品、责任或条件合并。产品身份可由来源信息消解，不据此推定计划适用范围。
  - 实体和关系的description均直接摘录支持它的完整原文句子或完整表格行，保留原文措辞及条件、否定、例外、时间对象、数值基数；允许保留原文的“本公司、您”等称谓。不得改写成摘要、用省略号截断或拼接不相邻字句。短标题仅可证明该名称存在，不可替代具体规则正文。
  - 关系依据原文及已核实的产品、标题归属建立。产品专属实体与其真实产品或上位责任建立有依据的关联；description摘录支持该归属或联系的原文句子、标题或表格行，keywords说明联系类型。没有来源依据就不输出关系，不凭共同出现补联系。
  - 责任内规则依真实标题确定范围；同文件上级原文可提供共同前提。共享一项约定不证明其他规则也共享；不同计划的选择条件必须按原文保留。
  - 来源标记、页码、整理说明和输出示例不是保险事实，不作为规则或证据摘录。原文正文及明确标示的上级原文才是业务依据。产品实体可使用已核实的产品全称作为描述。
  不计算、不推定承保或赔付，不为凑数量拆实体或补关系。严格沿用原生JSON字段，不增加自定义字段。
evidence_selection_guidance: |
  本次模型接口使用证据编号代替description；上述摘录要求通过选择完整evidence_ids实现，适配器再生成原生JSON。
  选择直接支持实体或关系的证据；标题可支持身份/层级，完整正文才支持业务规则。保留共同前提、否定、例外和数值基数所在的完整单元。
  同一证据可被多个实体或关系引用。不同证据并列不表示规则共同适用，不根据产品归属推断计划或责任归属。
  只识别原文明示的实体和联系，不计算、不承诺承保或赔付，不为连通性补推断关系。
entity_extraction_json_examples:
  - |
    {"entities":[{"name":"<产品全称>｜<原文责任名>","type":"Coverage","description":"<支持该责任的完整原句>"},{"name":"<产品全称>｜<原文责任名>｜<规则短名>","type":"Rule","description":"<该责任下保留全部条件的完整规则原句>"}],"relationships":[{"source":"<产品全称>｜<原文责任名>","target":"<产品全称>｜<原文责任名>｜<规则短名>","keywords":"适用规则","description":"<同时支持该责任与规则联系的完整原句>"}]}
