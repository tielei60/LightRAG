entity_types_guidance: |
  从当前原文中提取有助于检索的实体和直接关系，使用以下类型；不匹配时使用Other。
  - Product：原文明确的保险产品及版本。
  - Plan：产品的投保计划或保障组合。
  - Coverage：保险责任、给付项目或保障范围。
  - UnderwritingRule：投保条件、核保要求及责任选择约束。
  - Rule：给付、等待期、免赔、除外、申请、合同变更等有明确适用范围的规则。
  - Organization：原文明确的保险公司或相关机构。
  - Concept：理解条款所需的定义、保险事故或适用条件。
  - Other：其他确有检索价值但无法归入以上类型的实体。

  只抽取当前原文明确支持的事实，不补猜产品版本、日期、条件或结论。
  产品专属的计划、责任和规则，名称及描述须保留原文可确定的产品归属，避免把不同产品的“计划一”或同名责任合为同一事实。
  描述和关系中保留影响意思的主体、适用计划、条件、否定、例外、数值及单位；有条件的给付不能写成无条件给付。
  核保规则是资料中的规则说明，不构成对个案的核保决定；公式只作为原文说明，不计算保费或现金价值。
  图谱用于定位相关原文，不需要把每个句子或数值拆成独立实体，也不为了增加数量而生成关系。
  实体和关系必须能够回溯当前原文；原文未说明的产品归属或限制保持未知。

  【来源上下文与命名】
  输入若包含“来源上下文”，其中经原件核实的产品全称可用于消解本段“本产品/本合同”的产品归属，不能用文件归属推定全部计划、全部责任均适用。
  产品实体名称使用上下文或原文明示的完整名称。产品专属实体名称采用“产品全称｜原文计划名/责任名/规则名”，保留原文称呼；同产品同责任名称保持一致，不用文件名或页码区分同一责任。
  不同计划共享同一责任且条件相同，可让多个计划关联同一责任实体；同一责任在计划或条件下有不同规则时，将规则名称及描述限定到真实适用范围，不将差异合并为一个无条件结论。
  通用定义不必全部创建专属副本；原文定义含本合同专属限制时须保留产品限定。目录、页码、分隔符和来源上下文标签不是业务实体，目录列出标题不证明对应责任存在。

  【计划、责任及规则之间的直接关系】
  按本段明确依据抽取产品包含计划、计划包含基本责任/选择可选责任、责任受规则约束、规则适用条件、责任免除、定义引用等关系。keywords写清实际关系含义，不能全部写“相关”。
  片段的产品专属计划、责任、合同义务或给付规则，应与本段产品、对应责任或明确上位规则建立原文支持的关系，避免只抽取几个相互关联的规则而遗漏它们的产品归属。产品与产品专属规则可表达“本产品合同规定/适用规则”，不因此推定某个计划的责任范围。
  只有本段明确给出计划与责任的映射时才连接计划，不把条款没有说明的计划补猜出来。责任名称和计划名称不互相替代，可选责任不写成所有被保险人自动享有。
  描述保留：谁适用、针对哪项责任、何时触发、是否必须选择、期限/年龄/免赔/给付比例及基数、累计或单次限制、否定和例外。原文“约定比例的60%”不能写成固定报销60%；“实际住院日数减3日”不能改成前三天必然赔付或医疗责任免赔额。
  公共规则按原文范围保留，不随意缩到某一计划；没有明确范围保持未说明。多个条件共同成立时保留其组合，不拆成无条件关系。不要根据领域常识增加免责、承保决定或缺失条件。
  输出前在本次响应内检查：关系端点均存在；产品专属实体命名一致；关系描述没有丢掉可选前提、否定或例外；可证明的产品归属没有遗漏。不增加补抽调用，不强行让所有节点连通，不为凑数量添加实体。
entity_extraction_json_examples:
  - |
    {
      "entities": [
        {"name": "<entity_name>", "type": "<entity_type>", "description": "<description_supported_by_source>"},
        {"name": "<related_entity_name>", "type": "<entity_type>", "description": "<description_supported_by_source>"}
      ],
      "relationships": [
        {"source": "<entity_name>", "target": "<related_entity_name>", "keywords": "<relationship_keywords>", "description": "<relationship_with_conditions_and_exceptions>"}
      ]
    }
