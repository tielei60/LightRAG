    示例计算表保险的现金价值指本合同所具有的价值。犹豫期后解除合同，按合同约定退还现金价值；现金价值按本合同所交保险费×（1－35%）×（1－已过保险期间日数／保险期间日数）确定，经过日数不足一日的按一日计算；适用下列退还限制，不以利益演示金额代替。

    示例计算表保险现金价值退还限制（本条款的权益限制表）：
    | 解除时情形 | 退还约定 |
    | --- | --- |
    | 未发生保险事故且未发生保险金给付 | 按合同约定退还现金价值 |
    | 已发生保险金给付 | 不退还现金价值 |
